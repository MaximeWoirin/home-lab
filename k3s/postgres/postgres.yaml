apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        part-of: homelab
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-password
                  key: password
            - name: POSTGRES_USER
              value: admin
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
